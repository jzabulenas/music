<mat-card>
  <mat-card-header>
    <mat-card-title data-testid="artist-name">{{ recommendation().name }}</mat-card-title>

    @if (recommendation().genre) {
      <mat-card-subtitle data-testid="artist-genre">{{ recommendation().genre }}</mat-card-subtitle>
    }
  </mat-card-header>

  @if (recommendation().reason) {
    <mat-card-content>
      <p data-testid="reason">{{ recommendation().reason }}</p>
    </mat-card-content>
  }

  <mat-card-actions>
    <button mat-button [disabled]="isSaved()" (click)="onSave()">
      {{ isSaved() ? 'Saved' : 'Save for later' }}
    </button>

    <button mat-button [disabled]="isBlocked()" (click)="onBlock()">
      {{ isBlocked() ? "Won't suggest again" : "Don't suggest again" }}
    </button>
  </mat-card-actions>
</mat-card>
