<h1>Recommendations</h1>

@if (error()) {
  <p class="error-msg" role="alert">{{ error() }}</p>
}

<app-generate-button
  [artistCount]="artistCount()"
  [loading]="loading()"
  (generate)="onGenerate()"
/>

@if (recommendations().length > 0) {
  <ul class="recommendation-list">
    @for (rec of recommendations(); track rec.id) {
      <li>
        <app-recommendation-card
          [recommendation]="rec"
          [alreadySaved]="savedArtistNames().has(rec.name)"
          [alreadyBlocked]="blockedArtistNames().has(rec.name)"
          (saved)="onSave($event)"
          (blocked)="onBlock($event)"
        />
      </li>
    }
  </ul>
}
