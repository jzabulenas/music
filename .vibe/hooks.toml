[[hooks]]
name = "prettier"
type = "post_tool"
match = "re:(edit|write_file)"
command = "FILE=$(jq -r '.tool_input.file_path // .tool_input.path'); if echo \"$FILE\" | grep -q '/frontend/'; then cd frontend && npx prettier --write \"$FILE\"; elif echo \"$FILE\" | grep -q '/backend/'; then cd backend && npx prettier --plugin=prettier-plugin-java --write \"$FILE\"; fi"
description = "Run Prettier on edited/written files (frontend TS/HTML, backend Java)"
